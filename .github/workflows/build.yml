name: build-realbg

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Theos + iOS SDK
        run: |
          brew install ldid xz || true
          export THEOS=$HOME/theos
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL -o /tmp/sdks.tar.gz https://github.com/theos/sdks/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          cp -R /tmp/sdks-master/*.sdk "$THEOS/sdks/" || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          ls "$THEOS/sdks"

      - name: 源码逻辑测试（白名单 / 守卫 / 后门回归）
        run: |
          python3 tests/test_logic.py .

      - name: 编译主工程
        run: |
          make clean || true
          # 链接必须成功。Makefile 已经去掉了 -Wl,-undefined,dynamic_lookup，
          # 所以「能链上」就等于「所有符号在 iOS SDK 里都存在」——
          # 这是防止 dyld 在 main 之前杀进程的第一道闸。
          make FINALPACKAGE=1

      - name: 编译 lite 探针版
        run: |
          cd lite
          make clean || true
          make FINALPACKAGE=1

      - name: 组装主包
        run: |
          set -e
          APP=""
          for c in ".theos/_/Applications/RealBG.app" ".theos/obj/RealBG.app" ".theos/obj/debug/RealBG.app"; do
            if [ -d "$c" ]; then APP="$c"; break; fi
          done
          if [ -z "$APP" ]; then APP=$(find .theos -type d -name "RealBG.app" | sort | head -n 1); fi
          if [ -z "$APP" ] || [ ! -f "$APP/RealBG" ]; then
            echo "没找到 .app"; find .theos -maxdepth 4 -name "*.app" -print; exit 1
          fi
          echo "APP=$APP"
          cp RealBG/Info.plist "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"
          cp RealBG/*.png "$APP"/ 2>/dev/null || true
          ldid -Sentitlements.plist "$APP/RealBG"
          echo "=== 主包 entitlements ==="
          ldid -e "$APP/RealBG"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry RealBG.tipa Payload
          cp RealBG.tipa RealBG.ipa

      - name: 组装探针包
        run: |
          set -e
          cd lite
          APP=""
          for c in ".theos/_/Applications/RealBGLite.app" ".theos/obj/RealBGLite.app" ".theos/obj/debug/RealBGLite.app"; do
            if [ -d "$c" ]; then APP="$c"; break; fi
          done
          if [ -z "$APP" ]; then APP=$(find .theos -type d -name "RealBGLite.app" | sort | head -n 1); fi
          if [ -z "$APP" ] || [ ! -f "$APP/RealBGLite" ]; then
            echo "没找到探针 .app"; find .theos -maxdepth 4 -name "*.app" -print; exit 1
          fi
          echo "APP=$APP"
          cp Info.plist "$APP/Info.plist"
          plutil -lint "$APP/Info.plist"
          cp ../RealBG/*.png "$APP"/ 2>/dev/null || true
          ldid -Sentitlements.plist "$APP/RealBGLite"
          echo "=== 探针包 entitlements ==="
          ldid -e "$APP/RealBGLite"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ../RealBGLite.tipa Payload

      - name: 二进制诊断（依赖库 / 未定义符号 / 段布局）
        run: |
          for f in Payload/RealBG.app/RealBG lite/Payload/RealBGLite.app/RealBGLite; do
            [ -f "$f" ] || continue
            echo "########## $f ##########"
            lipo -info "$f"
            otool -h "$f" | sed -n '2,8p'
            echo "--- 依赖库 ---"
            otool -L "$f"
            echo "--- LC_BUILD_VERSION ---"
            otool -l "$f" | grep -A5 LC_BUILD_VERSION | head -8
            echo "--- 未定义符号（应全部由上面这些库提供）---"
            nm -u "$f" | sort
            echo "--- 是否残留私有框架依赖（应为空）---"
            otool -L "$f" | grep -Ei "PrivateFrameworks|FrontBoard|RunningBoard|SpringBoard" || echo "(无)"
            echo
          done

      - name: 产物硬校验
        run: |
          python3 tests/verify_tipa.py RealBG.tipa --app RealBG --bundle cn.bswbw.RealBG --version 1.4.1
          # 探针包只有 2 条权限，用完整清单去要求它不合适，加 --lite 走简化断言
          python3 tests/verify_tipa.py RealBGLite.tipa --app RealBGLite --bundle cn.bswbw.RealBGLite --version 1.0 --lite

      - uses: actions/upload-artifact@v4
        with:
          name: RealBG-tipa
          path: |
            RealBG.tipa
            RealBG.ipa
            RealBGLite.tipa

      - name: 回推产物到 dist 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B dist
          git add -f RealBG.tipa RealBG.ipa RealBGLite.tipa
          git commit -m "build: RealBG ${GITHUB_SHA::7}" || echo "no change"
          git push -f origin dist
